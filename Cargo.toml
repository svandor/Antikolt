[workspace]
resolver = "2"
members = [
    "crates/antikolt-ipc",
    "crates/antikolt-core",
    "crates/antikolt-core-service",
    "crates/antikolt-probe",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
repository = "https://github.com/antikolt/antikolt"
authors = ["Antikolt Project"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Vault cryptography (ADR-031): AES-256-GCM records, Argon2id master-password key derivation,
# and secure erasure of key material.
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
# TOTP (RFC 6238): HMAC over SHA-1/256/512 and base32 for the stored secret.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
# CSV import (Chrome/Firefox password export).
csv = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
