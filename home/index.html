<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<html lang="hu" data-theme="grey" data-language="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Antikolt</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip" href="#grid">Ugrás a kártyákhoz</a>

    <header class="topbar">
      <div class="brand" aria-label="Antikolt">Antikolt</div>

      <nav class="workspaces" id="workspaces" role="tablist" aria-label="Munkaterületek"></nav>

      <!-- Adding a card is the home page's own job (ADR-061): a URL, an optional title, Enter. No dialog. -->
      <button
        type="button"
        class="card-add"
        id="card-add"
        aria-label="Új kártya"
        title="Új kártya (Ctrl N)"
      >
        ＋
      </button>

      <form class="search-wrap" role="search" onsubmit="return false">
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Keresés — cím, webcím, jegyzet, címke, oldalszöveg (ékezet nélkül is)"
          aria-label="Keresés"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="search-hint" aria-hidden="true">Ctrl K</kbd>
      </form>

      <div class="themes" role="group" aria-label="Téma">
        <button type="button" data-theme-set="light" title="Világos" aria-label="Világos téma">☀</button>
        <button type="button" data-theme-set="grey" title="Szürke (alap)" aria-label="Szürke téma" aria-pressed="true">◐</button>
        <button type="button" data-theme-set="dark" title="Sötét" aria-label="Sötét téma">☾</button>
        <button type="button" data-theme-set="amoled" title="AMOLED" aria-label="AMOLED téma">●</button>
      </div>

      <div class="mem" id="mem" aria-live="polite" title="Memória-állapot (a böngésző méri)">—</div>
    </header>

    <main>
      <section class="pinned" id="pinned-section" hidden aria-labelledby="pinned-heading">
        <h2 class="section-title" id="pinned-heading">Kitűzve</h2>
        <div class="pinned-row" id="pinned" role="list"></div>
      </section>

      <section class="all" aria-labelledby="all-heading">
        <div class="section-head">
          <h2 class="section-title" id="all-heading">Kártyák</h2>
          <span class="count" id="count" aria-live="polite"></span>
        </div>

        <!-- The container legend is also the filter: one chip per container, coloured, with the count the current
             search shows (ADR-051). -->
        <div class="container-legend" id="container-legend" role="group" aria-label="Konténerek szűrése"></div>

        <!-- The add-card editor: in the page, not in a dialog (ADR-061). -->
        <div class="card-add-host" id="card-add-form" hidden></div>

        <!-- Virtualised: only the visible rows exist in the DOM (docs/HU/03, rule 1). -->
        <div class="viewport" id="viewport" role="list" aria-label="Kártyák">
          <div class="spacer" id="spacer">
            <div class="window" id="window"></div>
          </div>
        </div>
      </section>

      <p class="empty" id="empty" hidden>Nincs a keresésnek megfelelő kártya.</p>
    </main>

    <footer class="hint">
      <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <span data-i18n="mozgás">mozgás</span></span>
      <span><kbd>Enter</kbd> <span data-i18n="megnyitás">megnyitás</span></span>
      <span><kbd>Ctrl</kbd>+<kbd>K</kbd> <span data-i18n="keresés">keresés</span></span>
      <span><kbd>Esc</kbd> <span data-i18n="keresés törlése">keresés törlése</span></span>
      <span class="spacer-flex"></span>
      <span id="engine" class="muted">motor: —</span>
    </footer>

    <!-- A classic, deferred script on purpose: the engine loads this page from `file://`, and Chromium
         refuses module scripts from a file: origin (CORS), which left the grid rendering nothing at
         all inside the browser while the file still worked when opened by hand. `defer` keeps the
         module's timing: after the DOM is parsed, before `DOMContentLoaded` handlers run. -->
    <script src="antikolt-card.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
